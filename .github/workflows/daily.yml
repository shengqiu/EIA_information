name: 每日采集并发布（北京时间 09:00）

# 2026-10-18 起主采集提前到北京时间 00:17（UTC 16:17），让 wuxi-leads 第 1 步（00:43 / 01:13）当晚就能读到湖州新公告、
# 02:23 交给 Claude 分析、早上推送。原来的 09:00（UTC 01:00）保留为白天备用，防 GitHub 定时被丢。
# 注意：workflow 名字里的「09:00」不能改——drive.yml 的 workflow_run 按名字触发。
on:
  schedule:
    - cron: '17 16 * * *'
    - cron: '0 1 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  collect:
    # 配了 SCRAPE_URL（境内云函数）就跑在 GitHub 托管 runner 上，完全不用管网络；
    # 没配的话默认也在托管 runner 上，但需要你自己改成境内 self-hosted runner
    # （Settings → Variables 加 RUNNER_LABEL = self-hosted），否则抓不到政务站。
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 装依赖
        run: pip install requests beautifulsoup4

      # 路线 A（推荐）：调境内云函数抓取 —— 托管 runner 在境外也能用
      - name: 从境内云函数取新公告
        id: remote
        if: ${{ vars.SCRAPE_MODE != 'local' }}
        env:
          SCRAPE_URL: ${{ secrets.SCRAPE_URL }}
          SCRAPE_TOKEN: ${{ secrets.SCRAPE_TOKEN }}
        run: |
          if [ -z "$SCRAPE_URL" ]; then
            echo "::warning::没配 SCRAPE_URL，跳过云函数路线"
            exit 0
          fi
          python3 tools/fetch_remote.py

      # 云函数已经「采集 + 附件直链解析」一次做完：新公告带回来的 links 会被
      # fetch_remote.py 合并进 data/oss_links.csv，Google Drive 同步直接读这份表。
      # 之前解析失败的那几条（比如指向政务外网专用域名的），每天顺便重试一次。
      # 失败无所谓，所以不带 || true 之外的后果。
      - name: 重试没解析出直链的附件
        if: ${{ vars.SCRAPE_MODE != 'local' }}
        env:
          SCRAPE_URL: ${{ secrets.SCRAPE_URL }}
          SCRAPE_TOKEN: ${{ secrets.SCRAPE_TOKEN }}
        run: |
          if [ -z "$SCRAPE_URL" ]; then
            exit 0
          fi
          python3 tools/fetch_remote.py --resolve-missing || true

      # 路线 B：本机直接抓 —— 只有境内 runner 才有效
      - name: 跑单元测试
        run: python3 -m unittest discover -s tests

      - name: 本机采集
        if: ${{ vars.SCRAPE_MODE == 'local' }}
        run: python3 monitor.py

      - name: 渲染看板
        run: python3 tools/render.py

      # 保险丝：0 条就不提交、不发布，免得把线上看板清空
      - name: 校验数据
        id: gate
        run: |
          python3 - <<'PY'
          import json, sys
          items = json.load(open('data/items.json', encoding='utf-8'))
          if not items:
              sys.exit('公告 0 条，拒绝提交和发布')
          html = open('reports/index.html', encoding='utf-8').read()
          n = html.count('"unit":')
          if n == 0:
              sys.exit('看板里 0 条公告，拒绝发布')
          att = sum(len(p.get('附件链接', [])) for i in items for p in i.get('项目', []))
          print(f'::notice::公告 {len(items)} 条 / 附件 {att} 个')
          PY

      - name: 提交结果
        id: commit
        if: steps.gate.outcome == 'success'
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add data reports
          if git diff --cached --quiet; then
            echo '::notice::无变化'
          else
            git commit -m "data: 自动采集 $(date -u +%F) 09:00 CST"
            git push origin "$(git branch --show-current)"
          fi

      # GITHUB_TOKEN 的 push 不会触发其它 workflow，所以部署也放在本流程里
      - name: 配置 Pages
        if: steps.gate.outcome == 'success'
        uses: actions/configure-pages@v5

      - name: 上传看板
        if: steps.gate.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: reports

      - name: 部署到 Pages
        if: steps.gate.outcome == 'success'
        id: deployment
        uses: actions/deploy-pages@v4

      - name: 失败指引
        if: failure()
        run: |
          echo "::warning::本次没采到数据，线上看板保持原样未被覆盖。"
          echo "::warning::推荐配路线 A：境内云函数 + secret SCRAPE_URL / SCRAPE_TOKEN"
          echo "::warning::见 cloud/README.md（腾讯云 SCF / 阿里云 FC 都有免费额度）"
