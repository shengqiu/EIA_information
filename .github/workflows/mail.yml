name: 按项目发邮件

# 手动触发才跑（`MAIL_LIMIT` 控制每次几封，默认 1）。
# 境外 runner 用 --link-only：跳过附件下载（网关下不动），带附件项目正文发
# 政务网网关直链（境内可打开）+ OSS 直链（境外可下），两条都从 CSV 查表得来。
# 跨运行建议间隔 ≥ 10 分钟，避免 QQ 判 spam。
# SMTP 凭证全部走 GitHub Secrets，仓库里只有 .env.example 模板。

# ⚠️ 定时发送已停用（2026-10-15）。
# 原因：附件本体已经改走「境内云函数解析 OSS 直链 → Actions → Google Drive」
#      （tools/to_drive.py + drive.yml），邮件不再是拿到附件的必经路径。
# 想恢复定时：把下面两行注掉的代码加回来即可；临时补发/看历史项目手动 Run workflow。
on:
  # schedule:
  #   - cron: '0 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write          # 回写 data/mail_state.json 需要

concurrency:
  group: mail
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 装依赖
        run: pip install requests

      - name: 发邮件
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          MAIL_LIMIT: ${{ secrets.MAIL_LIMIT }}
          MAIL_INTERVAL: ${{ secrets.MAIL_INTERVAL }}
        run: python3 tools/mailer.py --link-only --yes

      # Actions 无状态，必须把 mail_state.json 提交回去，已发的下次才不会重发
      - name: 回写发信状态
        if: always()
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/mail_state.json
          if git diff --cached --quiet; then
            echo '::notice::无变化（没有新邮件发出）'
          else
            git commit -m "mail: 更新发信状态 $(date -u +%FT%TZ)"
            git push origin "$(git branch --show-current)"
          fi
