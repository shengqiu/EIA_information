name: 附件同步 Google Drive

# 把环评项目同步到 Google Drive，目录结构（2026-10-16 起，按用户要求重做，
# 原来是 <base>/<分局>/<项目>/，现在是不按分局的扁平一层）：
#
#     gdrive:湖州线索/
#       └── <项目名称>/
#             ├── 网页内容.txt          ← 公告标题/类型/日期/链接/项目明细/正文
#             └── 解压后的环评附件        ← .pdf 直接传；.zip/.rar/.7z 下载解压后传
#
# OSS 直链境外可达（Actions 出口实测 206、250~324KB/s），所以「下载 + 解压 +
# 上传」都能在 Actions 闭环；被挡的政务网网关全程不碰。公开仓库 Actions 免费。
#
# 凭证只走 GitHub Secrets，仓库里没有任何密钥。两种模式二选一：
#   模式 1（Service Account，默认）：GDRIVE_SA_JSON + DRIVE_FOLDER_ID
#     - 前提：目标文件夹在「共享云端硬盘」里且 SA 是磁盘成员。
#     - SA 存储配额为 0，往「我的云端硬盘」传文件会被 Google 拒（403
#       Service Accounts do not have storage quota）——2026-10-15 实测。
#   模式 2（OAuth 用户授权）：GDRIVE_TOKEN + DRIVE_FOLDER_ID
#     - 以用户本人身份上传，文件占用户 15GB 免费配额，免费个人账号可用。
#     - token 获取：自己电脑跑 rclone authorize "drive"，浏览器登录后
#       把输出的 JSON 存进 secret。配了 GDRIVE_TOKEN 就自动切到此模式。
# 一次性配置见 docs/04-附件下载.md「同步到 Google Drive」一节。
#
# 增量续跑：data/drive_state.json 按目标文件记账（text|/url|/file|/arc| 键），
# 已传的跳过；每传完一个就落盘，中途挂了下次接着跑。压缩包全部解出文件都传完
# 才标记 arc 任务完成，下次不再重复下载。新附件要等境内跑一次
# download.py --resolve 补进映射表才会出现在这里。

on:
  # 改了同步脚本或 workflow 自身 → 立即跑一次验证。
  # state 去重，没有新文件时约 1 分钟空转（探活 + 退出），成本可忽略；
  # 有待传文件时才真跑，正好是改完脚本想看到的结果。
  push:
    branches: [main]
    paths:
      - 'tools/to_drive.py'
      - 'tools/eia_common.py'   # 共享层：改了它 to_drive 行为可能变，一起验证
      - '.github/workflows/drive.yml'
  # 主触发：每日采集跑完（daily.yml 已把云函数解析好的直链写进 data/oss_links.csv）
  # 就紧接着同步，约 09:05 CST 开工。daily.yml 失败时不触发（也没新东西可传）。
  workflow_run:
    workflows: ["每日采集并发布（北京时间 09:00）"]
    types: [completed]
  schedule:
    - cron: '30 2 * * *'   # 兜底：每天 10:30 CST。有 state 去重，重复跑几乎空转
  workflow_dispatch:

permissions:
  contents: write          # 回写 data/drive_state.json 需要

concurrency:
  group: drive
  cancel-in-progress: false

jobs:
  sync:
    # workflow_run 触发时才判上游结论；手动触发和定时跑不受影响
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 装 rclone
        run: curl https://rclone.org/install.sh | sudo bash

      # .rar/.7z 附件解压依赖 bsdtar（libarchive，能正确处理中文文件名）；
      # .zip 走 Python zipfile，不需要外部工具。ubuntu-latest 默认没有 bsdtar。
      - name: 装 bsdtar（rar 解压）
        run: sudo apt-get update && sudo apt-get install -y libarchive-tools

      - name: 写 Drive 凭证（只进 runner 临时目录，不进 git）
        env:
          SA_JSON: ${{ secrets.GDRIVE_SA_JSON }}
          DRIVE_TOKEN: ${{ secrets.GDRIVE_TOKEN }}
        run: |
          mkdir -p "$RUNNER_TEMP/gdrive"
          if [ -n "$DRIVE_TOKEN" ]; then
            # 模式 2：OAuth 用户授权。token 是 JSON blob，经 GITHUB_ENV  heredoc
            # 传给 rclone（RCLONE_CONFIG_GDRIVE_TOKEN 必须是 JSON 本身，不是路径）
            {
              echo "RCLONE_CONFIG_GDRIVE_TOKEN<<GDRIVE_TOKEN_EOF"
              printf '%s' "$DRIVE_TOKEN"
              echo ""
              echo "GDRIVE_TOKEN_EOF"
            } >> "$GITHUB_ENV"
            echo "::notice::Drive 凭证模式：OAuth 用户授权（文件占用户本人配额）"
          else
            # 模式 1：Service Account
            printf '%s' "$SA_JSON" > "$RUNNER_TEMP/gdrive/sa.json"
            echo "RCLONE_CONFIG_GDRIVE_SERVICE_ACCOUNT_FILE=$RUNNER_TEMP/gdrive/sa.json" >> "$GITHUB_ENV"
            # 打印 SA 邮箱（非敏感），方便核对 Drive 分享对象；私钥不进日志
            python3 -c "import json; d=json.load(open('$RUNNER_TEMP/gdrive/sa.json')); print('SA 邮箱:', d['client_email'])"
            echo "::notice::Drive 凭证模式：Service Account（无存储配额，仅共享云端硬盘可传）"
          fi

      - name: 规范 Drive 配置环境变量
        # secret 里可能意外带上换行/空格，导致 rclone 拿到的 ROOT_FOLDER_ID 是脏值
        # （表现为 101 个文件全部 mkdir 404）。这里统一去掉空白并校验长度。
        env:
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
        run: |
          FID="$(printf '%s' "$DRIVE_FOLDER_ID" | tr -d '[:space:]')"
          echo "ROOT_FOLDER_ID 长度 ${#FID}"
          if [ "${#FID}" -lt 20 ] || [ "${#FID}" -gt 40 ]; then
            echo "::warning::DRIVE_FOLDER_ID 长度 ${#FID} 异常（Google 文件夹 ID 一般 33 字符），请核对 secrets"
          fi
          echo "RCLONE_CONFIG_GDRIVE_ROOT_FOLDER_ID=$FID" >> "$GITHUB_ENV"

      - name: 同步附件到 Drive
        env:
          RCLONE_CONFIG_GDRIVE_TYPE: drive
        run: python3 tools/to_drive.py

      # Actions 无状态，必须把 drive_state.json 提交回去，下次才不会重传
      - name: 回写同步状态
        if: always()
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/drive_state.json
          if git diff --cached --quiet; then
            echo '::notice::无变化（没有新传文件）'
          else
            git commit -m "drive: 更新同步状态 $(date -u +%FT%TZ)"
            # 2026-10-15 首个运行就栽在这：同步跑了 10 分钟，期间别人推了新提交，
            # 直接 push 被拒（non-fast-forward），状态文件丢失。先 rebase 再推。
            git pull --rebase origin "$(git branch --show-current)"
            git push origin "$(git branch --show-current)"
          fi
